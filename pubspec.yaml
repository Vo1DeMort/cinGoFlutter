name: cinego
description: "CineGo — a premium movie discovery and ticket booking experience."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-1.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-2.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-3.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-4.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-5.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-1.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-2.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-3.ttf
          weight: 700
